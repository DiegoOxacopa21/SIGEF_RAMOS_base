name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: pdo_sqlite, session
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Unit tests
        if: always()
        run: php vendor/bin/pest tests/Unit --no-coverage

      - name: Integration tests
        if: always()
        run: php vendor/bin/pest tests/Integration --no-coverage

      - name: Smoke tests
        if: always()
        run: php vendor/bin/pest tests/Smoke --no-coverage

      - name: Snapshot tests
        if: always()
        run: php vendor/bin/pest tests/Snapshot --no-coverage

      - name: Mutation tests
        if: always()
        run: php vendor/bin/pest tests/Mutation --no-coverage

      - name: Contract tests
        if: always()
        run: php vendor/bin/pest tests/Contract --no-coverage

      - name: Regression tests
        if: always()
        run: |
          php vendor/bin/pest tests/Regression/UserLoginRegressionTest.php --no-coverage
          php vendor/bin/pest tests/Regression/SaleDateRegressionTest.php --no-coverage
          php vendor/bin/pest tests/Regression/PaymentComprobanteRegressionTest.php --no-coverage

      - name: Start server & run E2E tests
        if: always()
        run: |
          php -S localhost:9999 &>/dev/null &
          sleep 2
          php vendor/bin/pest tests/E2E --no-coverage

      - name: Coverage summary
        if: always()
        run: php vendor/bin/pest tests/Unit tests/Integration tests/Smoke tests/Snapshot tests/Mutation tests/Contract tests/Regression/UserLoginRegressionTest.php tests/Regression/SaleDateRegressionTest.php tests/Regression/PaymentComprobanteRegressionTest.php --coverage-text --only-summary-for-coverage-text
